<h2 mat-dialog-title>
  <mat-icon>{{ isEdit ? 'edit' : 'add_circle' }}</mat-icon>
  <span>{{ isEdit ? 'Editar tipo de episodio' : 'Nuevo tipo de episodio' }}</span>
</h2>

<div mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Código</mat-label>
        <input
          matInput
          formControlName="code"
          placeholder="Ej: PRIMERA_SOLICITUD"
          autocomplete="off"
        />
        <mat-error *ngIf="form.controls['code'].hasError('required')">
          El código es obligatorio.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input
          matInput
          formControlName="name"
          placeholder="Ej: Primera solicitud"
          autocomplete="off"
        />
        <mat-error *ngIf="form.controls['name'].hasError('required')">
          El nombre es obligatorio.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Descripción</mat-label>
        <textarea
          matInput
          formControlName="description"
          rows="4"
          placeholder="Descripción del tipo de episodio"
        ></textarea>
      </mat-form-field>

      <mat-checkbox formControlName="active" class="full">
        Registro activo
      </mat-checkbox>
    </div>
  </form>
</div>

<div mat-dialog-actions align="end">
  <button
    mat-stroked-button
    type="button"
    (click)="close()"
    [disabled]="saving"
  >
    Cancelar
  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="saving"
  >
    <mat-icon>{{ saving ? 'hourglass_empty' : 'save' }}</mat-icon>
    {{ saving ? 'Guardando...' : 'Guardar' }}
  </button>
</div>
