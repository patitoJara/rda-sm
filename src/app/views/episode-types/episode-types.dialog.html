<section class="dialog-shell">
  <header class="dialog-header">
    <div>
      <span class="eyebrow">Catálogo RDA-SM</span>
      <h2>{{ isEdit ? 'Editar tipo de episodio' : 'Nuevo tipo de episodio' }}</h2>
      <p>
        Define el código y nombre utilizado al crear episodios o nuevas demandas.
      </p>
    </div>

    <button mat-icon-button type="button" aria-label="Cerrar" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <form class="dialog-body" [formGroup]="form" (ngSubmit)="save()">
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Código</mat-label>
        <input
          matInput
          formControlName="code"
          placeholder="PRIMERA_SOLICITUD"
          autocomplete="off"
        />
        <mat-error *ngIf="form.controls['code'].hasError('required')">
          El código es obligatorio.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input
          matInput
          formControlName="name"
          placeholder="Primera solicitud"
          autocomplete="off"
        />
        <mat-error *ngIf="form.controls['name'].hasError('required')">
          El nombre es obligatorio.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Descripción</mat-label>
        <textarea
          matInput
          formControlName="description"
          rows="4"
          placeholder="Descripción del tipo de episodio"
        ></textarea>
      </mat-form-field>

      <mat-checkbox formControlName="active" class="full">
        Registro activo
      </mat-checkbox>
    </div>

    <footer class="dialog-actions">
      <button mat-stroked-button type="button" (click)="close()" [disabled]="saving">
        Cancelar
      </button>

      <button mat-raised-button color="primary" type="submit" [disabled]="saving">
        <mat-icon>{{ saving ? 'hourglass_empty' : 'save' }}</mat-icon>
        {{ saving ? 'Guardando...' : 'Guardar' }}
      </button>
    </footer>
  </form>
</section>
