<h2 mat-dialog-title>
  <mat-icon>{{ form.value.id ? 'edit' : 'add_circle' }}</mat-icon>
  <span>{{ form.value.id ? 'Editar no relevante' : 'Nuevo no relevante' }}</span>
</h2>

<div mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline" class="full">
      <mat-label>No relevante</mat-label>
      <input
        matInput
        formControlName="name"
        autocomplete="off"
        maxlength="120"
        (keydown.enter)="save()"
      />
      <mat-hint align="end">{{ form.value.name?.length || 0 }}/120</mat-hint>
      <mat-error *ngIf="form.get('name')?.hasError('required')">
        El nombre es obligatorio.
      </mat-error>
      <mat-error *ngIf="form.get('name')?.hasError('maxlength')">
        Máximo 120 caracteres.
      </mat-error>
    </mat-form-field>
  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">
    Cancelar
  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="form.invalid"
  >
    Guardar
  </button>
</div>
