<h2 mat-dialog-title>
  <mat-icon>handshake</mat-icon>
  {{ form.value.id ? 'Editar previsión' : 'Nueva previsión' }}
</h2>

<div mat-dialog-content>
  <form [formGroup]="form" class="form">
    <mat-form-field appearance="outline" floatLabel="always" class="full">
      <mat-label>Tipo de previsión</mat-label>

      <mat-select formControlName="intPrevId">
        <mat-option *ngFor="let item of intPrevList" [value]="item.id">
          {{ item.name }}
        </mat-option>
      </mat-select>

      <mat-error *ngIf="form.get('intPrevId')?.hasError('required')">
        El tipo de previsión es obligatorio.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" floatLabel="always" class="full">
      <mat-label>Nombre de la previsión</mat-label>

      <input
        matInput
        formControlName="name"
        autocomplete="off"
        placeholder="Ej: Fonasa A"
        (keydown.enter)="save()"
      />

      <mat-error *ngIf="form.get('name')?.hasError('required')">
        El nombre de la previsión es obligatorio.
      </mat-error>

      <mat-error *ngIf="form.get('name')?.hasError('maxlength')">
        El nombre no puede superar los 120 caracteres.
      </mat-error>
    </mat-form-field>
  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="save()"
    [disabled]="form.invalid">
    Guardar
  </button>
</div>
